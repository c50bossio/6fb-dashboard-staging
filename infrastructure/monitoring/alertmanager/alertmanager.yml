# =============================================================================
# TIME INTERVALS (Business Hours Configuration)
# =============================================================================

time_intervals:
  # Business hours: 9 AM - 6 PM EST, Monday-Friday
  - name: 'business-hours'
    time_intervals:
      - times:
          - start_time: '09:00'
            end_time: '18:00'
        weekdays: ['monday:friday']
        location: 'America/New_York'
        
  # After hours: All other times
  - name: 'after-hours'  
    time_intervals:
      # Weekday evenings
      - times:
          - start_time: '18:00'
            end_time: '09:00'
        weekdays: ['monday:friday'] 
        location: 'America/New_York'
      # Weekends (all day)
      - weekdays: ['saturday', 'sunday']
        location: 'America/New_York'
        
  # Maintenance windows (optional)
  - name: 'maintenance-window'
    time_intervals:
      - times:
          - start_time: '02:00'
            end_time: '04:00'
        weekdays: ['sunday']
        location: 'America/New_York'

