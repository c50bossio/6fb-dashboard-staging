# AlertManager Configuration for 6FB AI Agent System
# Comprehensive alert routing and notification management with SRE best practices
# Version: 2.0 - Consolidated Configuration

global:
  # SMTP configuration for email alerts
  smtp_smarthost: '${SMTP_SMARTHOST:-localhost:587}'
  smtp_from: '${SMTP_FROM:-alerts@6fb.ai}'
  smtp_auth_username: '${SMTP_USERNAME:-}'
  smtp_auth_password: '${SMTP_PASSWORD:-}'
  smtp_require_tls: true
  smtp_hello: '6fb.ai'
  
  # HTTP configuration  
  http_config:
    tls_config:
      insecure_skip_verify: false
  
  # Global template
  templates:
    - '/etc/alertmanager/templates/*.tmpl'
  
  # Resolve timeout - how long to wait before sending resolved notification
  resolve_timeout: 5m

# Template files for custom alert formatting
templates:
  - '/etc/alertmanager/templates/6fb-alerts.tmpl'
  - '/etc/alertmanager/templates/business-alerts.tmpl'

# Inhibit rules - prevent duplicate/redundant alerts
inhibit_rules:
  # Don't send warning alerts if critical alerts are firing for the same service
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'instance', 'service']
    
  # Don't send infrastructure alerts if service is down
  - source_matchers:
      - alertname="ServiceDown"
    target_matchers:
      - category="infrastructure"
    equal: ['instance']
    
  # Don't send performance alerts if service is down
  - source_matchers:
      - alertname="ServiceDown"
    target_matchers:
      - category="performance"
    equal: ['instance', 'service']

# Main routing configuration
route:
  # Default grouping
  group_by: ['alertname', 'cluster', 'service']
  
  # How long to wait before sending initial notification
  group_wait: 30s
  
  # How long to wait before sending additional notifications for the same group
  group_interval: 5m
  
  # How long to wait before re-sending notifications
  repeat_interval: 4h
  
  # Default receiver
  receiver: 'default-notifications'
  
  # Child routes for specific alert types
  routes:
    # ==========================================================================
    # CRITICAL ALERTS - IMMEDIATE RESPONSE REQUIRED
    # ==========================================================================
    - matchers:
        - severity="critical"
      receiver: 'critical-pager-alerts'
      group_wait: 10s
      repeat_interval: 15m
      continue: true  # Also send to other matching routes
      
    # Service down alerts - immediate escalation
    - matchers:
        - alertname="ServiceDown"
      receiver: 'service-down-escalation'
      group_wait: 5s
      repeat_interval: 10m
      
    # SLO breach alerts - business critical
    - matchers:
        - category="slo"
      receiver: 'slo-breach-alerts'
      group_wait: 15s
      repeat_interval: 30m
      
    # ==========================================================================  
    # SECURITY ALERTS - IMMEDIATE SECURITY TEAM NOTIFICATION
    # ==========================================================================
    - matchers:
        - category="security"
      receiver: 'security-incident-team'
      group_wait: 10s
      repeat_interval: 30m
      routes:
        # High severity security incidents
        - matchers:
            - severity="critical"
          receiver: 'security-critical-escalation'
          group_wait: 5s
          repeat_interval: 15m
          
    # ==========================================================================
    # BUSINESS ALERTS - BUSINESS STAKEHOLDER NOTIFICATIONS  
    # ==========================================================================
    - matchers:
        - category="business"
      receiver: 'business-stakeholder-alerts'
      group_interval: 30m
      repeat_interval: 4h
      routes:
        # Revenue/commission critical issues
        - matchers:
            - component=~"commissions|payments|revenue"
            - severity="critical"
          receiver: 'business-critical-alerts'
          group_wait: 30s
          repeat_interval: 2h
          
    # AI system alerts - specialized routing
    - matchers:
        - component="ai"
      receiver: 'ai-system-alerts'
      group_interval: 10m
      repeat_interval: 2h
      routes:
        # High AI costs
        - matchers:
            - category="cost"
          receiver: 'cost-management-alerts'
          group_wait: 60s
          repeat_interval: 6h
          
    # ==========================================================================
    # PERFORMANCE ALERTS - OPERATIONS TEAM
    # ==========================================================================  
    - matchers:
        - category="performance"
      receiver: 'performance-ops-team'
      group_interval: 10m
      repeat_interval: 2h
      routes:
        # Database performance issues
        - matchers:
            - category="database"
          receiver: 'database-ops-team'
          group_interval: 15m
          repeat_interval: 4h
          
    # ==========================================================================
    # INFRASTRUCTURE ALERTS - INFRASTRUCTURE TEAM
    # ==========================================================================
    - matchers:
        - category="infrastructure"
      receiver: 'infrastructure-ops-team'
      group_interval: 15m
      repeat_interval: 4h
      routes:
        # Container/Kubernetes issues
        - matchers:
            - alertname=~"Container.*|Pod.*|Kubernetes.*"
          receiver: 'container-ops-team'
          
    # ==========================================================================
    # COMPLIANCE ALERTS - COMPLIANCE TEAM
    # ==========================================================================
    - matchers:
        - category="compliance"
      receiver: 'compliance-team-alerts'
      group_interval: 30m
      repeat_interval: 24h  # Daily digest for compliance issues
      
    # ==========================================================================
    # MONITORING SYSTEM ALERTS - MONITORING TEAM  
    # ==========================================================================
    - matchers:
        - category="monitoring"
      receiver: 'monitoring-team-alerts'
      group_interval: 5m
      repeat_interval: 1h
      
    # ==========================================================================
    # TIME-BASED ROUTING (Business hours vs After hours)
    # ==========================================================================
    - matchers:
        - severity=~"warning|info"
      receiver: 'business-hours-alerts'
      active_time_intervals: 
        - 'business-hours'
      group_interval: 30m
      repeat_interval: 8h
      
    - matchers:
        - severity=~"warning|info"  
      receiver: 'after-hours-alerts'
      active_time_intervals:
        - 'after-hours'
      group_interval: 60m
      repeat_interval: 12h

# =============================================================================
# RECEIVER CONFIGURATIONS
# =============================================================================

receivers:
  # ---------------------------------------------------------------------------
  # DEFAULT RECEIVER
  # ---------------------------------------------------------------------------
  - name: 'default-notifications'
    email_configs:
      - to: '${DEFAULT_EMAIL:-admin@6fb.ai}'
        subject: '[6FB Alert] {{ .GroupLabels.alertname }} - {{ .Status | title }}'
        html: '{{ template "6fb.default" . }}'
        headers:
          X-Priority: '3'
          
  # ---------------------------------------------------------------------------
  # CRITICAL ALERTS - PAGER/ONCALL INTEGRATION
  # ---------------------------------------------------------------------------
