# Grafana Datasource Configuration for 6FB AI Agent System
# Automatic provisioning of Prometheus datasource

apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  # Primary Prometheus instance
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    uid: prometheus-uid
    url: http://prometheus:9090
    isDefault: true
    version: 1
    editable: false
    basicAuth: false
    withCredentials: false
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.45.0
      cacheLevel: 'High'
      disableRecordingRules: false
      incrementalQueryOverlapWindow: '10s'
      queryTimeout: '300s'
      timeInterval: '15s'
      # Enable exemplars for tracing
      exemplarTraceIdDestinations:
        - name: TraceID
          datasourceUid: jaeger-uid
          url: 'http://jaeger:16686/trace/$${__value.raw}'
    secureJsonFields: {}
    
