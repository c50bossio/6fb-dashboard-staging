# Docker Compose for 6FB AI Agent System Monitoring Stack
# Complete monitoring solution with Prometheus, Grafana, AlertManager, and exporters
# Version: 2.0

version: '3.8'

services:
  # =============================================================================
  # PROMETHEUS - TIME SERIES DATABASE
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: 6fb-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=50GB'
      - '--storage.tsdb.wal-compression'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--query.max-concurrency=20'
      - '--query.timeout=5m'
      - '--web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://localhost:9090}'
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATACENTER=${DATACENTER:-primary}
      - APP_VERSION=${APP_VERSION:-latest}
    networks:
      - monitoring
    depends_on:
      - alertmanager
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=9090"

  # =============================================================================
  # GRAFANA - VISUALIZATION & DASHBOARDS
  # =============================================================================
  grafana:
    image: grafana/grafana:10.1.0
    container_name: 6fb-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"  # Use 3001 to avoid conflicts with app frontend
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
      - grafana_logs:/var/log/grafana
    environment:
      # Basic configuration
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      
      # Server configuration
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN:-localhost}
      - GF_SERVER_ROOT_URL=${GRAFANA_URL:-http://localhost:3001}
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      
      # Database configuration (using SQLite for simplicity)
      - GF_DATABASE_TYPE=sqlite3
      - GF_DATABASE_PATH=/var/lib/grafana/grafana.db
      
      # Session configuration
      - GF_SESSION_PROVIDER=file
      - GF_SESSION_COOKIE_SECURE=false
      - GF_SESSION_COOKIE_SAME_SITE=lax
      
      # Analytics & reporting
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      
      # Feature toggles
      - GF_FEATURE_TOGGLES_ENABLE=ngalert
      - GF_UNIFIED_ALERTING_ENABLED=true
      
      # SMTP configuration for alerts (optional)
      - GF_SMTP_ENABLED=${SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${SMTP_SMARTHOST:-localhost:587}
      - GF_SMTP_USER=${SMTP_USERNAME:-}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM:-grafana@6fb.ai}
      
      # Logging
      - GF_LOG_MODE=console file
      - GF_LOG_LEVEL=info
    networks:
      - monitoring
    depends_on:
      - prometheus
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=3000"

  # =============================================================================
  # ALERTMANAGER - ALERT ROUTING & NOTIFICATIONS
  # =============================================================================
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: 6fb-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}'
      - '--web.route-prefix=/'
      - '--cluster.listen-address=0.0.0.0:9094'
      - '--log.level=info'
    environment:
      # SMTP configuration
      - SMTP_SMARTHOST=${SMTP_SMARTHOST:-localhost:587}
      - SMTP_FROM=${SMTP_FROM:-alerts@6fb.ai}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      
      # Alert destination emails
      - DEFAULT_EMAIL=${DEFAULT_EMAIL:-admin@6fb.ai}
      - ONCALL_EMAIL=${ONCALL_EMAIL:-oncall@6fb.ai}
      - SECURITY_EMAIL=${SECURITY_EMAIL:-security@6fb.ai}
      - BUSINESS_EMAIL=${BUSINESS_EMAIL:-business@6fb.ai}
      - SRE_EMAIL=${SRE_EMAIL:-sre@6fb.ai}
      - OPS_EMAIL=${OPS_EMAIL:-ops@6fb.ai}
      - AI_TEAM_EMAIL=${AI_TEAM_EMAIL:-ai-team@6fb.ai}
      - FINANCE_EMAIL=${FINANCE_EMAIL:-finance@6fb.ai}
      - COMPLIANCE_EMAIL=${COMPLIANCE_EMAIL:-compliance@6fb.ai}
      
      # Integration keys (optional)
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - PAGERDUTY_SERVICE_KEY=${PAGERDUTY_SERVICE_KEY:-}
    networks:
      - monitoring
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=9093"

  # =============================================================================
  # BLACKBOX EXPORTER - ENDPOINT MONITORING
  # =============================================================================
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: 6fb-blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
      - '--web.listen-address=:9115'
      - '--log.level=info'
    environment:
      - API_HEALTH_TOKEN=${API_HEALTH_TOKEN:-}
    networks:
      - monitoring
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=9115"

  # =============================================================================
  # NODE EXPORTER - SYSTEM METRICS
  # =============================================================================
  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: 6fb-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.systemd'
      - '--collector.processes'
      - '--collector.interrupts'
      - '--collector.tcpstat'
      - '--collector.conntrack'
      - '--web.listen-address=:9100'
      - '--log.level=info'
    networks:
      - monitoring
    pid: host
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=9100"

  # =============================================================================
  # CADVISOR - CONTAINER METRICS
  # =============================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: 6fb-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '--port=8080'
      - '--housekeeping_interval=30s'
      - '--max_housekeeping_interval=35s'
      - '--event_storage_event_limit=default=0'
      - '--event_storage_age_limit=default=0'
      - '--disable_metrics=percpu,sched,tcp,udp,disk,diskIO,accelerator,hugetlb,referenced_memory,cpu_topology,resctrl'
      - '--docker_only=true'
      - '--store_container_labels=false'
      - '--whitelisted_container_labels=io.prometheus.scrape'
    networks:
      - monitoring
    privileged: true
    devices:
      - /dev/kmsg
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=8080"

  # =============================================================================
  # REDIS EXPORTER - REDIS CACHE METRICS
  # =============================================================================
  redis-exporter:
    image: oliver006/redis_exporter:v1.52.0
    container_name: 6fb-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=${REDIS_URL:-redis://redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_EXPORTER_LOG_FORMAT=txt
      - REDIS_EXPORTER_DEBUG=false
    command:
      - '--redis.addr=${REDIS_URL:-redis://redis:6379}'
      - '--web.listen-address=:9121'
      - '--web.telemetry-path=/metrics'
      - '--log-format=txt'
    networks:
      - monitoring
    depends_on:
      - redis
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=9121"

  # =============================================================================
  # POSTGRES EXPORTER - DATABASE METRICS
  # =============================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.13.2
    container_name: 6fb-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    volumes:
      - ./postgres-exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    environment:
      - DATA_SOURCE_NAME=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/sixfb_agent_system?sslmode=disable}
      - PG_EXPORTER_EXTEND_QUERY_PATH=/etc/postgres_exporter/queries.yaml
      - PG_EXPORTER_LOG_LEVEL=info
      - PG_EXPORTER_WEB_LISTEN_ADDRESS=:9187
      - PG_EXPORTER_WEB_TELEMETRY_PATH=/metrics
    networks:
      - monitoring
    depends_on:
      - postgres
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=9187"

  # =============================================================================
  # NGINX PROMETHEUS EXPORTER - WEB SERVER METRICS
  # =============================================================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:0.11.0
    container_name: 6fb-nginx-exporter
    restart: unless-stopped
    ports:
      - "9113:9113"
    command:
      - '-nginx.scrape-uri=http://nginx:8080/nginx_status'
      - '-web.listen-address=:9113'
      - '-web.telemetry-path=/metrics'
    networks:
      - monitoring
    depends_on:
      - nginx
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=9113"

  # =============================================================================
  # SUPPORTING SERVICES (for demonstration)
  # =============================================================================
  
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: 6fb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly yes
      - --appendfsync everysec
      - --maxmemory 512mb
      - --maxmemory-policy allkeys-lru
    networks:
      - monitoring
    labels:
      - "prometheus.io/scrape=false"

  # PostgreSQL Database  
  postgres:
    image: postgres:15-alpine
    container_name: 6fb-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_DB=sixfb_agent_system
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    networks:
      - monitoring
    labels:
      - "prometheus.io/scrape=false"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: 6fb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8081:8080"  # Status page for exporter
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - monitoring
    depends_on:
      - grafana
      - prometheus
    labels:
      - "prometheus.io/scrape=false"

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  prometheus_data:
    driver: local
    name: 6fb_prometheus_data
  grafana_data:
    driver: local
    name: 6fb_grafana_data
  grafana_logs:
    driver: local
    name: 6fb_grafana_logs
  alertmanager_data:
    driver: local
    name: 6fb_alertmanager_data
  postgres_data:
    driver: local
    name: 6fb_postgres_data
  redis_data:
    driver: local
    name: 6fb_redis_data

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  monitoring:
    name: 6fb_monitoring
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16