# Development Docker Compose Configuration
# Extends base configuration with development-specific settings
# Version: 1.0 - Infrastructure Consolidation
# Date: 2025-08-25

# Usage: docker-compose -f docker-compose.base.yml -f docker-compose.dev.yml up

services:
  redis:
    ports:
      - "6379:6379"
    environment:
      - LOG_LEVEL=debug

  frontend:
    extends:
      file: docker-compose.base.yml
      service: frontend
    ports:
      - "9999:9999"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - FASTAPI_BASE_URL=http://backend:8000
      - NEXT_PUBLIC_ENABLE_MOCK_FALLBACK=true
      # Development email settings
      - SMTP_HOST=smtp.sendgrid.net
      - SMTP_PORT=587
    env_file:
      - ../../.env.local
      - ../../.env.development
    volumes:
      # Hot reload volumes for development
      - ../../app:/app/app:delegated
      - ../../components:/app/components:delegated
      - ../../hooks:/app/hooks:delegated
      - ../../lib:/app/lib:delegated
      - ../../public:/app/public:delegated
      - ../../styles:/app/styles:delegated
      - ../../package.json:/app/package.json:delegated
      - ../../next.config.js:/app/next.config.js:delegated
      - ../../tailwind.config.js:/app/tailwind.config.js:delegated
      - ../../tsconfig.json:/app/tsconfig.json:delegated
      # Preserve node_modules
      - frontend_node_modules:/app/node_modules
    command: npm run dev

  backend:
    extends:
      file: docker-compose.base.yml
      service: backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/agent_system.db
      - CORS_ORIGINS=http://localhost:9999,http://localhost:3000,http://127.0.0.1:9999
      - LOG_LEVEL=debug
      - RELOAD=true
    env_file:
      - ../../.env.local
      - ../../.env.development
    volumes:
      # Hot reload for Python files
      - ../../:/app:delegated
      - agent_data:/app/data
      - agent_databases:/app/databases
    command: uvicorn fastapi_backend:app --host 0.0.0.0 --port 8000 --reload

  # Optional: Development database UI
  adminer:
    image: adminer:4.8.1
    container_name: agent-system-adminer
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DESIGN=pepa-linha-dark
    networks:
      - agent-network
    profiles:
      - debug

  # Optional: Redis commander for cache inspection
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: agent-system-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - agent-network
    profiles:
      - debug

  # Optional: Mailcatcher for email testing
  mailcatcher:
    image: schickling/mailcatcher:latest
    container_name: agent-system-mailcatcher
    ports:
      - "1080:1080"  # Web interface
      - "1025:1025"  # SMTP port
    networks:
      - agent-network
    profiles:
      - debug