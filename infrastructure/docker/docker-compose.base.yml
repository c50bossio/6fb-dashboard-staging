# Base Docker Compose Configuration
# Shared service definitions for all environments
# Version: 1.0 - Infrastructure Consolidation
# Date: 2025-08-25

x-common-variables: &common-variables
  PYTHONPATH: /app
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
  SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

x-resource-limits-small: &resource-limits-small
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 512M
      reservations:
        cpus: '0.1'
        memory: 128M

x-resource-limits-medium: &resource-limits-medium
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 1G
      reservations:
        cpus: '0.25'
        memory: 256M

x-resource-limits-large: &resource-limits-large
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 2G
      reservations:
        cpus: '0.5'
        memory: 512M

x-healthcheck-web: &healthcheck-web
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

x-healthcheck-api: &healthcheck-api
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  # Redis - Shared caching layer for AI responses
  redis:
    image: redis:7.2-alpine
    container_name: agent-system-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    <<: *resource-limits-small

  # Frontend - Next.js Application
  frontend:
    build:
      context: ../..
      dockerfile: Dockerfile.frontend
    container_name: agent-system-frontend
    environment:
      <<: *common-variables
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
      NEXT_PUBLIC_ENABLE_RAG: ${NEXT_PUBLIC_ENABLE_RAG:-true}
      NEXT_PUBLIC_ENABLE_MOCK_FALLBACK: ${NEXT_PUBLIC_ENABLE_MOCK_FALLBACK:-false}
    volumes:
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9999/api/health || exit 1"]
      <<: *healthcheck-web
    restart: unless-stopped
    <<: *resource-limits-medium

  # Backend - FastAPI Application
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile.backend
    container_name: agent-system-backend
    environment:
      <<: *common-variables
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/agent_system.db}
      REDIS_URL: redis://redis:6379
      USE_FASTAPI: "true"
      USE_SUPABASE: "true"
      DOCKER_ENVIRONMENT: "true"
    volumes:
      - agent_data:/app/data
      - agent_databases:/app/databases
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      <<: *healthcheck-api
    restart: unless-stopped
    <<: *resource-limits-medium

networks:
  agent-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  frontend_node_modules:
    driver: local
  agent_data:
    driver: local
  agent_databases:
    driver: local
  redis_data:
    driver: local