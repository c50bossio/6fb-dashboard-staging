apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-config
  labels:
    app.kubernetes.io/name: 6fb-ai-agent-system
    app.kubernetes.io/managed-by: kustomize
    environment: development
data:
  # Development-specific API Configuration
  api-url: "http://backend:8000"
  fastapi-base-url: "http://backend:8000"
  redis-url: "redis://redis:6379"
  
  # Development Logging Configuration
  log-level: "debug"
  enable-debug: "true"
  reload: "true"
  
  # Development Feature Flags
  enable-rag: "true"
  enable-mock-fallback: "true"
  enable-hot-reload: "true"
  
  # Development CORS Configuration
  cors-origins: "http://localhost:3000,http://localhost:9999,http://127.0.0.1:9999,http://frontend:80"
  
  # Development Database Configuration
  use-fastapi: "true"
  use-supabase: "true"
  docker-environment: "true"
  database-url-dev: "sqlite:///./data/agent_system_dev.db"
  
  # Development Resource Configuration
  workers: "1"
  
  # Development Redis Configuration
  redis-maxmemory: "128mb"
  redis-maxmemory-policy: "allkeys-lru"
  redis-debug: "true"
  
  # Development Email Configuration (using test services)
  smtp-host: "mailcatcher"
  smtp-port: "1025"
  
  # Development Monitoring
  enable-metrics: "true"
  metrics-port: "9090"
  enable-profiling: "true"