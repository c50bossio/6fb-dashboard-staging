apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-resource-patch
spec:
  template:
    spec:
      containers:
      - name: frontend
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 2Gi
          limits:
            cpu: 2000m
            memory: 2Gi
            ephemeral-storage: 4Gi
        env:
        - name: NODE_OPTIONS
          value: "--max_old_space_size=1536"
        - name: NEXT_TELEMETRY_DISABLED
          value: "1"
      # Add node affinity for performance
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - compute-optimized
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: frontend
              topologyKey: kubernetes.io/hostname
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-resource-patch
spec:
  template:
    spec:
      containers:
      - name: backend
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 2Gi
          limits:
            cpu: 2000m
            memory: 2Gi
            ephemeral-storage: 4Gi
        env:
        - name: UVICORN_WORKERS
          value: "4"
        - name: UVICORN_MAX_WORKERS
          value: "8"
        - name: UVICORN_WORKER_CONNECTIONS
          value: "1000"
        - name: UVICORN_BACKLOG
          value: "2048"
        - name: GUNICORN_TIMEOUT
          value: "120"
        - name: GUNICORN_KEEPALIVE
          value: "5"
        - name: WORKERS_PER_CORE
          value: "1"
        - name: MAX_WORKERS
          value: "8"
        - name: WEB_CONCURRENCY
          value: "4"
      # Add node affinity for performance
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - compute-optimized
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: backend
              topologyKey: kubernetes.io/hostname
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-resource-patch
spec:
  template:
    spec:
      containers:
      - name: redis
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: 1000m
            memory: 1Gi
            ephemeral-storage: 2Gi
        args:
        - redis-server
        - --appendonly
        - "yes"
        - --maxmemory
        - "512mb"
        - --maxmemory-policy
        - allkeys-lru
        - --save
        - "900 1"
        - --save
        - "300 10"
        - --save
        - "60 10000"
        - --tcp-keepalive
        - "300"
        - --timeout
        - "0"
        - --tcp-backlog
        - "511"
        - --databases
        - "16"
        - --loglevel
        - warning
        - --requirepass
        - $(REDIS_PASSWORD)
      # Redis should have node affinity for memory-optimized nodes
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - memory-optimized