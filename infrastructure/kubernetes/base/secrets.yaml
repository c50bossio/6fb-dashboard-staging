# This is a template file for secrets
# In production, use sealed-secrets, external-secrets-operator, or similar
# Never commit actual secret values to git

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app.kubernetes.io/name: 6fb-ai-agent-system
    app.kubernetes.io/managed-by: kustomize
type: Opaque
stringData:
  # Database URLs (replace with actual values)
  database-url: "sqlite:///./data/agent_system.db"
  
  # Supabase Configuration (replace with actual values)
  supabase-url: "YOUR_SUPABASE_URL"
  supabase-anon-key: "YOUR_SUPABASE_ANON_KEY"
  supabase-service-key: "YOUR_SUPABASE_SERVICE_KEY"
  
  # AI Provider API Keys (replace with actual values)
  openai-api-key: "YOUR_OPENAI_API_KEY"
  anthropic-api-key: "YOUR_ANTHROPIC_API_KEY"
  google-api-key: "YOUR_GOOGLE_API_KEY"
  
  # Stripe Configuration (replace with actual values)
  stripe-secret-key: "YOUR_STRIPE_SECRET_KEY"
  stripe-webhook-secret: "YOUR_STRIPE_WEBHOOK_SECRET"
  stripe-connect-client-id: "YOUR_STRIPE_CONNECT_CLIENT_ID"
  stripe-publishable-key: "YOUR_STRIPE_PUBLISHABLE_KEY"
  
  # Communication Services (replace with actual values)
  sendgrid-api-key: "YOUR_SENDGRID_API_KEY"
  twilio-account-sid: "YOUR_TWILIO_ACCOUNT_SID"
  twilio-auth-token: "YOUR_TWILIO_AUTH_TOKEN"
  twilio-phone-number: "YOUR_TWILIO_PHONE_NUMBER"
  
  # Real-time & Analytics (replace with actual values)
  pusher-app-id: "YOUR_PUSHER_APP_ID"
  pusher-app-key: "YOUR_PUSHER_APP_KEY"
  pusher-app-secret: "YOUR_PUSHER_APP_SECRET"
  pusher-app-cluster: "YOUR_PUSHER_APP_CLUSTER"
  
  # Monitoring & Analytics (replace with actual values)
  novu-api-key: "YOUR_NOVU_API_KEY"
  posthog-api-key: "YOUR_POSTHOG_API_KEY"
  posthog-host: "YOUR_POSTHOG_HOST"
  sentry-dsn: "YOUR_SENTRY_DSN"
  
  # Edge Configuration (replace with actual values)
  edge-config: "YOUR_EDGE_CONFIG"
  
  # Redis Password (replace with actual value)
  redis-password: "YOUR_REDIS_PASSWORD"